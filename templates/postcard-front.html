<html>
<head>
<meta charset="utf-8">
<style>
  /* Lob 4x6 postcard: 6.25 x 4.25 in with bleed */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 6.25in; height: 4.25in; background: #f6f1e7; font-family: Georgia, serif; color: #211c16; }
  .safe { position: absolute; inset: .1875in; padding: .3in; display: flex; flex-direction: column; justify-content: space-between; }
  .kicker { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; letter-spacing: .25em; text-transform: uppercase; color: {{PRIMARY}}; }
  h1 { font-size: 34pt; font-weight: 500; line-height: 1.05; margin-top: .12in; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; gap: .3in; }
  .url { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #6b5f4e; }
  .qr { width: 1.35in; height: 1.35in; padding: .08in; background: #fff; border: 1px solid #d8cdbb; }
  .qr img { width: 100%; height: 100%; }
  .scan { font-family: Helvetica, Arial, sans-serif; font-size: 8pt; letter-spacing: .18em; text-transform: uppercase; text-align: center; margin-top: .06in; color: #6b5f4e; }
</style>
</head>
<body>
  <div class="safe">
    <div>
      <div class="kicker">{{RESTAURANT}} — rebuilt</div>
      <h1>{{HEADLINE}}</h1>
    </div>
    <div class="row">
      <div class="url">{{URL}}</div>
      <div>
        <div class="qr"><img src="{{QR_DATA_URL}}"></div>
        <div class="scan">Scan me</div>
      </div>
    </div>
  </div>
</body>
</html>
